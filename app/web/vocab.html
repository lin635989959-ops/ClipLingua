<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipLingua · Vocabulary</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .tools { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 12px 14px; margin-bottom: 12px; }
  .tools input { flex: 1 1 200px; width: auto; }
  .tools select { font: inherit; padding: 6px 8px; }
  .words { display: flex; flex-direction: column; gap: 8px; }
  .word { padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; }
  .word .head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .word .w { font-size: 18px; font-weight: 700; }
  .word .zh { font-size: 16px; }
  .word .meta { font-size: 13px; color: var(--muted); }
  .word .note { font-size: 13px; color: var(--muted); grid-column: 2 / 4; }
  .word .forms { font-size: 13px; color: var(--muted); grid-column: 2 / 4; }
  .word .forms b { font-weight: 600; color: var(--text); }
  .word .say { display: flex; flex-direction: column; gap: 4px; }
  .word .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .word .src { grid-column: 2 / 4; font-size: 14px; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
  .word .src a { display: block; color: var(--text); padding: 2px 0; }
  .word .src a:hover { text-decoration: none; color: var(--accent); }
  .word .src .t { font-size: 12px; color: var(--muted); }
  .word .src .z { font-size: 13px; color: var(--muted); }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  .lv { letter-spacing: 1px; color: var(--accent); font-size: 13px; white-space: nowrap; }
  .lvline { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="btn" href="/" data-i18n="backHome">← 课程列表</a>
    <h1 data-i18n="navVocab">📒 总生词本</h1>
    <span class="spacer"></span>
    <a class="btn" href="/review" data-i18n="navReview">🔁 复习</a>
    <a class="btn" href="/review?free=1" data-i18n="tabFree">🎲 自由练习</a>
    <button id="csv" data-i18n="exportCsv">导出 CSV</button>
    <span data-ui-lang-slot></span>
  </header>
  <div class="card tools">
    <select id="lang"></select>
    <input type="text" id="q" data-i18n-ph="vocabSearch" autocomplete="off">
    <select id="filter"></select>
    <select id="sort"></select>
    <span id="voice-pick"></span>
    <span class="muted" id="count" style="font-size:13px"></span>
  </div>
  <p class="muted" style="font-size:13px;margin:-4px 2px 12px" data-i18n="vocabIntro"></p>
  <div class="words" id="list"></div>
</div>
<audio id="audio" preload="none"></audio>
<script src="/static/i18n.js"></script>
<script src="/static/common.js"></script>
<script>
"use strict";
mountUiLangPicker();
applyStaticI18n();
document.title = `${t("appName")} · ${t("navVocab")}`;

const $ = id => document.getElementById(id);
const audio = $("audio");
const player = new RangePlayer(audio);
let words = [];

$("lang").innerHTML = [["all", t("allLangs")], ...["sv", "en", "es", "zh"].map(c => [c, `${langName(c)} (${LANG_META[c].short})`])]
  .map(([v, lbl]) => `<option value="${v}">${esc(lbl)}</option>`).join("");
$("filter").innerHTML = [
  ["all", "fltAll"], ["unknown", "fltUnknown"], ["none", "fltNone"], ["known", "fltKnown"],
  ["notr", "fltNotr"], ["pending", "fltPending"], ["due", "fltDue"], ["new", "fltNew"],
  ["lv01", "fltLv01"], ["lv23", "fltLv23"], ["lv45", "fltLv45"],
].map(([v, k]) => `<option value="${v}">${esc(t(k))}</option>`).join("");
$("sort").innerHTML = [
  ["new", "sortNew"], ["old", "sortOld"], ["az", "sortAz"], ["level", "sortLv"], ["due", "sortDue"],
].map(([v, k]) => `<option value="${v}">${esc(t(k))}</option>`).join("");

for (const id of ["lang", "filter", "sort"]) {
  $(id).value = lsGet("vb." + id, $(id).value);
  $(id).addEventListener("change", () => {
    lsSet("vb." + id, $(id).value);
    if (id === "lang") updateVoicePick();
    render();
  });
}
$("q").addEventListener("input", render);

function activeVoiceLang() {
  const l = $("lang").value;
  return l === "all" ? (words[0]?.language || "sv") : l;
}
function updateVoicePick() {
  $("voice-pick").innerHTML = voicePickerHtml(activeVoiceLang());
  bindVoicePicker($("voice-pick"), () => render());
}
updateVoicePick();

api("GET", "/api/vocabbook").then(d => {
  words = d.words || [];
  updateVoicePick();
  render();
}).catch(err => toast(err.message));

function glossOf(w) { return w.text || w.zh || ""; }

function visible() {
  const q = $("q").value.trim().toLowerCase();
  const l = $("lang").value, f = $("filter").value, s = $("sort").value;
  const today = new Date().toLocaleDateString("sv-SE");
  let out = words.filter(w => {
    if (l !== "all" && (w.language || "sv") !== l) return false;
    if (q && ![w.lemma, glossOf(w), ...w.forms].some(x => (x || "").toLowerCase().includes(q))) return false;
    if (f === "unknown") return w.result === "unknown";
    if (f === "known") return w.result === "known";
    if (f === "none") return !w.result;
    if (f === "notr") return !glossOf(w);
    if (f === "pending") return w.pending;
    if (f === "due") return w.due && w.due <= today;
    if (f === "new") return w.reviewable && w.level == null;
    if (f.startsWith("lv")) return w.level != null && w.level >= +f[2] && w.level <= +f[3];
    return true;
  });
  const col = new Intl.Collator(langMeta(l === "all" ? "en" : l).collator);
  if (s === "az") out.sort((a, b) => col.compare(a.lemma, b.lemma));
  else if (s === "old") out.sort((a, b) => a.added_at.localeCompare(b.added_at));
  else if (s === "level") out.sort((a, b) => (a.level ?? -1) - (b.level ?? -1));
  else if (s === "due") out.sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  return out;
}

function render() {
  const list = visible();
  $("count").textContent = words.length ? `${list.length} / ${words.length}` : "";
  if (!words.length) {
    $("list").innerHTML = `<div class="card empty">${esc(t("vocabEmptyAll"))}</div>`;
    return;
  }
  $("list").innerHTML = list.map(w => {
    const wl = w.language || "sv";
    const gloss = glossOf(w);
    const badge = w.result === "known" ? `<span class="badge ok">${t("badgeKnown")}</span>`
      : w.result === "unknown" ? `<span class="badge bad">${t("badgeUnknown")}</span>`
      : `<span class="badge">${t("badgeUntested")}</span>`;
    const pend = w.pending ? `<span class="badge">${t("badgePending")}</span>` : "";
    const others = w.forms.filter(f => f !== w.lemma.toLowerCase());
    const forms = others.length ? `<div class="forms">${t("seenForms")}${others.map(f => `<b>${esc(f)}</b>`).join(" · ")}</div>` : "";
    const nLessons = new Set(w.sources.map(s => s.lesson_id)).size;
    const src = w.sources.map(s => `<a href="/lesson/${esc(s.lesson_id)}?tok=${esc(s.token_id)}">
      <span class="t">📹 ${esc(s.title || s.lesson_id)} · <b>${esc(s.form)}</b>${s.count > 1 ? ` ×${s.count}` : ""}</span><br>
      ${esc(s.sentence)}${(s.sentence_tr || s.sentence_zh) ? `<div class="z">${esc(s.sentence_tr || s.sentence_zh)}</div>` : ""}</a>`).join("");
    return `<div class="card word">
      <div class="say"><button class="ghost small" data-say="${esc(w.id)}">🔊</button>${wordVoice(wl) === "orig" ? "" :
        `<button class="ghost small" data-orig="${esc(w.id)}">${t("origBtn")}</button>`}</div>
      <div class="head">${langBadgeHtml(wl)}<span class="w">${esc(w.lemma)}</span>${w.pos ? `<span class="meta">${esc(posName(w.pos))}</span>` : ""}
        <span class="zh">${gloss ? esc(gloss) : `<span class="muted">${t("noGloss")}</span>`}</span>
        ${nLessons > 1 ? `<span class="meta">${t("inLessons", { n: nLessons })}</span>` : ""}</div>
      <div class="right">${badge}${pend}${reviewHtml(w)}<button class="ghost small" data-edit="${esc(w.id)}">✎</button></div>
      ${forms}
      ${w.note ? `<div class="note">${esc(w.note)}</div>` : ""}
      <div class="src">${src}</div>
    </div>`;
  }).join("") || `<div class="card empty">${esc(t("vocabEmptyFilter"))}</div>`;
}

function reviewHtml(w) {
  if (!w.reviewable) return "";
  if (w.level == null) return `<span class="lvline">${t("newWord")}</span>`;
  const today = new Date().toLocaleDateString("sv-SE");
  const when = w.due <= today ? t("dueToday") : t("dueNext", { d: w.due.slice(5) });
  return `<span class="lvline"><span class="lv">${"●".repeat(w.level)}${"○".repeat(5 - w.level)}</span><br>${when}</span>`;
}

$("list").addEventListener("click", e => {
  const ed = e.target.closest("[data-edit]");
  if (ed) return editEntry(words.find(x => x.id === ed.dataset.edit));
  const b = e.target.closest("[data-say], [data-orig]");
  if (!b) return;
  const w = words.find(x => x.id === (b.dataset.say || b.dataset.orig));
  const s = w?.sources[0];
  const orig = () => {
    if (!s) return;
    const src = `/media/${s.lesson_id}/audio`;
    if (!audio.src.endsWith(src)) audio.src = src;
    return player.play(s.start - 0.08, s.end + 0.15);
  };
  if (b.dataset.orig) { stopSpeaker(); orig(); }
  else if (w) speakWord(w.lemma, { lang: w.language || "sv", orig, stop: () => player.stop() });
});

async function editEntry(w) {
  if (!w) return;
  const lemma = prompt(t("editLemmaPrompt", { w: w.lemma, f: w.forms.join(", ") }), w.lemma);
  if (lemma === null || !lemma.trim()) return;
  let pos = prompt(t("editPosPrompt", { p: POS_CODES.join(" / ") }), w.pos || "");
  if (pos === null) return;
  pos = pos.trim();
  try {
    const d = await api("POST", "/api/vocabbook/entry", { id: w.id, lemma: lemma.trim(), pos });
    words = d.words; render(); toast(t("saved"));
  } catch (err) { toast(err.message); }
}

$("csv").addEventListener("click", () => {
  const rows = [["Language", "Lemma", "POS", "Meaning", "Forms", "Note", "Result", "Level", "Due", "Lessons", "Sentence", "Translation", "Added"]];
  for (const w of visible()) {
    const s = w.sources[0] || {};
    rows.push([
      w.language || "sv", w.lemma, w.pos, glossOf(w), w.forms.join(" / "), w.note, w.result || "",
      w.level ?? "", w.due || "", [...new Set(w.sources.map(x => x.title))].join(" / "),
      s.sentence || "", s.sentence_tr || s.sentence_zh || "", (w.added_at || "").slice(0, 10),
    ]);
  }
  const csv = "\ufeff" + rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `ClipLingua_vocab_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
</script>
</body>
</html>
